name: Isolated database restore drill
on: [push, pull_request]
permissions: { contents: read }
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: madad_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test -d madad_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://test:disposable-ci-only@localhost:5432/madad_test
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: test
      PGPASSWORD: disposable-ci-only
      PGDATABASE: madad_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - run: npm exec --workspace=backend -- prisma migrate deploy
      - name: Install database tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-client-16
      - name: Restore into a new database
        run: bash docker/restore-drill.sh
